
name: Build GUILIANO SUPPORT SUSHI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q GUILIANO-SUPPORT-SUSHI-Pro-v2-Android-Project.zip -d project

      - name: Build APK
        run: |
          cd project/GUILIANO-SUPPORT-SUSHI-Pro-v2
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GUILIANO-SUPPORT-SUSHI-APK
          path: project/GUILIANO-SUPPORT-SUSHI-Pro-v2/app/build/outputs/apk/debug/app-debug.apk

